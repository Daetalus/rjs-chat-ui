<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Mobile Header Gadget</title>
    <script src="rsvp.js"></script>
    <script src="renderjs.js"></script>
    <script src="mobile_header_gadget.js"></script>
  </head>
  <body>
    <style>
      :root {
        color-scheme: light;
        --header-foreground: #0f172a;
        --header-border: rgba(15, 23, 42, 0.18);
      }

      :root.dark {
        color-scheme: dark;
        --header-foreground: #f8fafc;
        --header-border: rgba(248, 250, 252, 0.28);
      }

      body {
        margin: 0;
        font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: transparent;
        color: var(--header-foreground);
      }

      .header-root {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 8px 0;
        color: inherit;
      }

      .header-button {
        width: 44px;
        height: 44px;
        border-radius: 14px;
        border: 1px solid var(--header-border);
        background: transparent;
        color: var(--header-foreground);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: background 0.2s ease, border-color 0.2s ease;
      }

      .header-button:hover {
        background: rgba(15, 23, 42, 0.06);
      }

      .dark body .header-button:hover {
        background: rgba(248, 250, 252, 0.12);
      }

      .header-icon {
        width: 22px;
        height: 16px;
        display: inline-flex;
        flex-direction: column;
        justify-content: space-between;
      }

      .header-icon span {
        display: block;
        height: 2px;
        border-radius: 999px;
        background: currentColor;
      }

      .header-title {
        font-size: 1.45rem;
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        border: 0;
      }
    </style>
    <div class="header-root" data-role="header-root">
      <button
        type="button"
        class="header-button"
        data-action="toggle-sidebar"
      >
        <span class="header-icon" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
        </span>
        <span class="sr-only">Toggle sidebar</span>
      </button>
      <span class="header-title" data-role="header-title">Rapid.Space RAG</span>
    </div>
  </body>
</html>
