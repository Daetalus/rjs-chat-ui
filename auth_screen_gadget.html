<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Auth Screen Gadget</title>

    <script src="rsvp.js"></script>
    <script src="renderjs.js"></script>
    <script src="auth_screen_gadget.js"></script>
  </head>
  <body>
    <style>
      :root {
        color-scheme: light;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Inter", "SF Pro Display", system-ui, -apple-system,
          BlinkMacSystemFont, "Segoe UI", sans-serif;
        min-height: 100vh;
      }

      .auth-root {
        width: 100%;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 16px;
        background: radial-gradient(
            circle at top,
            rgba(255, 255, 255, 0.95),
            rgba(241, 245, 249, 0.7)
          ),
          #f8fafc;
      }

      .auth-card {
        width: 100%;
        max-width: 420px;
        border-radius: 28px;
        border: 1px solid rgba(15, 23, 42, 0.06);
        background: rgba(255, 255, 255, 0.96);
        box-shadow: 0 30px 80px rgba(15, 23, 42, 0.18);
        color: #0f172a;
        padding: 40px 36px;
        backdrop-filter: blur(18px);
      }

      .auth-brand {
        text-align: center;
        margin-bottom: 28px;
      }

      .auth-brand-title {
        font-size: 28px;
        font-weight: 600;
        margin: 0;
        color: #111827;
      }

      .auth-brand-subtitle {
        margin-top: 10px;
        font-size: 15px;
        color: rgba(71, 85, 105, 0.9);
      }

      .auth-form {
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      .auth-field {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .auth-label {
        font-size: 13px;
        font-weight: 600;
        color: #0f172a;
      }

      .auth-input {
        border-radius: 16px;
        border: 1px solid rgba(15, 23, 42, 0.12);
        background: rgba(248, 250, 252, 0.95);
        padding: 12px 16px;
        font-size: 15px;
        color: #0f172a;
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }

      .auth-input:focus {
        outline: none;
        border-color: rgba(59, 130, 246, 0.75);
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
      }

      .auth-input:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .auth-error {
        border-radius: 14px;
        padding: 10px 14px;
        font-size: 13px;
        background: rgba(254, 226, 226, 0.7);
        border: 1px solid rgba(248, 113, 113, 0.7);
        color: #991b1b;
        display: none;
      }

      .auth-error[data-visible="true"] {
        display: block;
      }

      .auth-button {
        margin-top: 6px;
        width: 100%;
        border: none;
        border-radius: 18px;
        padding: 14px;
        font-size: 15px;
        font-weight: 600;
        color: #f8fafc;
        background: linear-gradient(135deg, #111827, #1f2937);
        box-shadow: 0 18px 40px rgba(15, 23, 42, 0.25);
        cursor: pointer;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }

      .auth-button:hover:not(:disabled) {
        transform: translateY(-1px);
        box-shadow: 0 22px 46px rgba(15, 23, 42, 0.3);
      }

      .auth-button:disabled {
        opacity: 0.7;
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
      }

      .auth-demo {
        margin-top: 20px;
        padding: 12px 14px;
        border-radius: 16px;
        background: rgba(241, 245, 249, 0.95);
        border: 1px solid rgba(15, 23, 42, 0.08);
        font-size: 13px;
        color: rgba(71, 85, 105, 0.95);
      }

      .auth-demo strong {
        color: #111827;
        font-weight: 600;
      }

      .auth-status {
        margin-top: 12px;
        font-size: 12px;
        color: rgba(71, 85, 105, 0.8);
        text-align: center;
      }
    </style>

    <div class="auth-root">
      <div class="auth-card">
        <div class="auth-brand">
          <h1 class="auth-brand-title">Nexedi RAG</h1>
          <p class="auth-brand-subtitle">
            Sign in to continue your conversations.
          </p>
        </div>

        <form class="auth-form" data-role="form">
          <div class="auth-field">
            <label class="auth-label" for="auth-username">Username</label>
            <input
              id="auth-username"
              class="auth-input"
              type="text"
              name="username"
              autocomplete="username"
              data-role="username"
              placeholder="Your username"
              required
            />
          </div>

          <div class="auth-field">
            <label class="auth-label" for="auth-password">Password</label>
            <input
              id="auth-password"
              class="auth-input"
              type="password"
              name="password"
              autocomplete="current-password"
              data-role="password"
              placeholder="••••••••"
              required
            />
          </div>

          <div class="auth-error" data-role="error"></div>

          <button type="submit" class="auth-button" data-role="submit">
            Sign in
          </button>
        </form>

        <div class="auth-demo">
          Demo credentials · <strong>nexedi</strong> / <strong>1234</strong>
        </div>
        <div class="auth-status" data-role="status"></div>
      </div>
    </div>
  </body>
</html>
