<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>RenderJS Chat + Sidebar Demo</title>

    <!-- 让移动端按设备宽度渲染 -->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Core dependencies -->
    <script src="rsvp.js"></script>
    <script src="renderjs.js"></script>

    <!-- Root gadget logic：负责 Chat / Prompt 的联动 -->
    <script src="index_gadget.js"></script>

    <!-- 颜色变量（sidebar.css） -->
    <link rel="stylesheet" href="sidebar.css">

    <style>
      html,
      body {
        height: 100%;
        font-size: 12px;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }

      body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Helvetica Neue",
          Arial, sans-serif;
        background: #f3f4f6;

        display: flex;
        flex-direction: column;
        overflow: hidden; /* 滚动交给内部容器 */
        --app-header-bg: #ffffff;
        --app-header-border: rgba(15, 23, 42, 0.08);
        --app-header-foreground: #0f172a;
      }

      body.dark {
        --app-header-bg: #0b1120;
        --app-header-border: rgba(248, 250, 252, 0.15);
        --app-header-foreground: #e2e8f0;
      }

      body[data-auth-state="locked"] .app-shell {
        visibility: hidden;
        pointer-events: none;
      }

      body[data-auth-state="unlocked"] .app-shell {
        visibility: visible;
      }

      /* 顶层横向结构：左 Sidebar + 右主内容 */
      .app-shell {
        flex: 1;
        min-height: 0;

        display: flex;
        flex-direction: row;
      }

      /* 左侧 sidebar 容器（宽度由 sidebar gadget 内部控制） */
      [data-gadget-scope="sidebar"] {
        flex: 0 0 auto;
        /* 不设置宽度，由 sidebar 内部 .sidebar-root 决定 */
      }

      /* 右侧主内容区域 */
      .app-main {
        flex: 1 1 auto;
        min-width: 0;
        min-height: 0;

        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .mobile-header {
        display: none;
      }

      @media (max-width: 1024px) {
        .mobile-header {
          display: block;
          position: sticky;
          top: 0;
          z-index: 5;
          background: var(--app-header-bg);
          border-bottom: 1px solid var(--app-header-border);
          color: var(--app-header-foreground);
          flex-shrink: 0;
        }

        .mobile-header-inner {
          padding: 0 16px;
        }
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        border: 0;
      }

      /* 整个聊天布局（上方滚动 chat，下方固定 prompt 或欢迎页） */
      .chat-layout {
        flex: 1;
        min-height: 0;
        height: 100%;
        overflow: hidden;

        display: flex;
        flex-direction: column;
        transition: background 0.2s ease;
      }

      .chat-layout[data-mode="landing"] .chat-scroll {
        display: none;
      }

      /* 上方滚动区域：滚动条在最右边 */
      .chat-scroll {
        flex: 1;
        min-height: 0;

        width: 100%;
        overflow-y: auto;
        overscroll-behavior: contain;
      }

      /* 中间一栏：居中，左右空白 */
      .page-center {
        width: 100%;
        margin: 0 auto;
        min-height: 0;

        display: flex;
        flex-direction: column;
      }

      /* 右侧的 chat gadget 容器 */
      [data-gadget-scope="chat"] {
        /* 在 page-center 内自然占满宽度即可 */
      }

      .prompt-zone {
        flex: 0 0 auto;
        padding: 0 0 16px;
        flex-shrink: 0;
      }

      .prompt-zone-inner {
        width: 100%;
        max-width: 960px;
        margin: 0 auto;
        padding: 0 16px;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 16px;
      }

      .prompt-landing-title {
        display: none;
        text-align: center;
        font-size: 2.2rem;
        line-height: 1.25;
        font-weight: 600;
        margin: 0;
        color: inherit;
      }

      .chat-layout[data-mode="landing"] {
        overflow: hidden;
      }

      .chat-layout[data-mode="landing"] .prompt-zone {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 0;
        overflow: hidden;
      }

      .chat-layout[data-mode="landing"] .prompt-zone-inner {
        min-height: 60vh;
        justify-content: center;
        align-items: center;
      }

      .auth-layer {
        position: fixed;
        inset: 0;
        z-index: 50;
        align-items: stretch;
        justify-content: center;
        background: radial-gradient(circle at top, rgba(15, 23, 42, 0.2), rgba(0, 0, 0, 0.65));
      }

      body[data-auth-state="unlocked"] .auth-layer {
        display: none;
      }

      .chat-layout[data-mode="landing"] .prompt-landing-title {
        display: block;
      }
    </style>
  </head>
  <body data-auth-state="locked">
      <div class="app-shell">
      <!-- 左侧 AppSidebar gadget -->
      <div
        data-gadget-url="app_sidebar_gadget.html"
        data-gadget-scope="sidebar"
        data-gadget-sandbox="public"
      ></div>

      <!-- 右侧主内容：Chat + Prompt -->
      <div class="app-main" data-role="app-main">
        <div class="mobile-header" data-role="mobile-header-container">
          <div class="mobile-header-inner">
            <div
              data-gadget-url="mobile_header_gadget.html"
              data-gadget-scope="header"
              data-gadget-sandbox="public"
            ></div>
          </div>
        </div>

        <div class="chat-layout" data-role="chat-layout" data-mode="chat">
          <!-- 上方滚动区域：Chat Container -->
          <div class="chat-scroll">
            <div class="page-center">
              <div
                data-gadget-url="chat_container_gadget.html"
                data-gadget-scope="chat"
                data-gadget-sandbox="public"
              ></div>
            </div>
          </div>

          <!-- 下方固定 Prompt Input -->
          <div class="prompt-zone">
            <div class="prompt-zone-inner">
              <h2 class="prompt-landing-title">RAG Assistant</h2>
              <div class="page-center">
                <div
                  data-gadget-url="prompt_input_gadget.html"
                  data-gadget-scope="prompt"
                  data-gadget-sandbox="public"
                ></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="auth-layer" data-role="auth-layer">
      <div
        data-gadget-url="auth_screen_gadget.html"
        data-gadget-scope="auth"
        data-gadget-sandbox="public"
      ></div>
    </div>

    <noscript>Please enable JavaScript.</noscript>
  </body>
</html>
