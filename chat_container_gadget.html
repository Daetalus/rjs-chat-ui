<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Chat Container Gadget</title>

    <!-- 每个 gadget 自己带上依赖 -->
    <script src="rsvp.js"></script>
    <script src="renderjs.js"></script>
    <script src="markdown-it.min.js"></script>
    <script src="dompurify.min.js"></script>
    <script src="chat_container_gadget.js"></script>



  </head>
  <body>
    <style>
      :root {
        color-scheme: light;
        --chat-bg: #f3f4f6;
        --chat-panel: #ffffff;
        --chat-border: #e5e7eb;
        --chat-text: #0f172a;
        --chat-accent: rgba(15, 23, 42, 0.04);
        --chat-user-bg: #e5e7eb;
        --chat-user-text: #111827;
        --chat-assistant-bg: #ffffff;
        --chat-assistant-text: #111827;
        --chat-avatar-bg: #111827;
        --chat-avatar-text: #ffffff;
      }

      :root.dark {
        color-scheme: dark;
        --chat-bg: #0b1220;
        --chat-panel: #111827;
        --chat-border: rgba(255, 255, 255, 0.08);
        --chat-text: #f8fafc;
        --chat-accent: rgba(248, 250, 252, 0.08);
        --chat-user-bg: #1f2738;
        --chat-user-text: #f8fafc;
        --chat-assistant-bg: rgba(15, 23, 42, 0.85);
        --chat-assistant-text: #f8fafc;
        --chat-avatar-bg: #f8fafc;
        --chat-avatar-text: #0f172a;
      }

      body {
        margin: 0;
        background: var(--chat-bg);
        color: var(--chat-text);
        font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      .chat-root {
        display: flex;
        flex-direction: column;
        width: 100%;
        min-height: 100%;
        padding-top: 1.6rem;
      }

      .chat-log {
        padding: 16px 0;
        box-sizing: border-box;
      }

      .chat-log-inner {
        max-width: 768px;
        margin: 0 auto;
        padding: 0 16px;
        box-sizing: border-box;
      }

      .message-row {
        display: flex;
        margin-bottom: 12px;
      }

      .message-row--assistant {
        justify-content: flex-start;
      }

      .message-row--user {
        justify-content: flex-end;
      }

      .message-avatar {
        width: 32px;
        height: 32px;
        border-radius: 9999px;
        background: var(--chat-avatar-bg);
        color: var(--chat-avatar-text);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        margin-right: 8px;
        flex-shrink: 0;
      }

      .message-content-wrapper {
        max-width: 80%;
      }

      .message-bubble {
        padding: 8px 12px;
        border-radius: 12px;
        font-size: 16px;
        line-height: 1.6;
        white-space: pre-wrap;
        word-break: break-word;
        border: 1px solid transparent;
      }

      .message-bubble--assistant {
        background: var(--chat-assistant-bg);
        color: var(--chat-assistant-text);
        border-color: var(--chat-border);
        border-bottom-left-radius: 4px;
      }

      .message-bubble--user {
        background: var(--chat-user-bg);
        color: var(--chat-user-text);
        border-color: var(--chat-user-bg);
        border-bottom-right-radius: 4px;
      }

      .message-row--user .message-content-wrapper {
        margin-right: 4px;
      }

      .message-row--assistant .message-content-wrapper {
        margin-left: 4px;
      }

      .message-bubble--assistant .markdown-body {
        font-size: 1.3rem;
        line-height: 1.5;
        color: inherit;
        margin: 0;
      }

      .message-bubble--assistant .markdown-body h1,
      .message-bubble--assistant .markdown-body h2,
      .message-bubble--assistant .markdown-body h3,
      .message-bubble--assistant .markdown-body h4,
      .message-bubble--assistant .markdown-body h5,
      .message-bubble--assistant .markdown-body h6 {
        font-weight: 600;
        line-height: 1.25;
        margin: 1.1rem 0 0.8rem;
      }

      .message-bubble--assistant .markdown-body p {
        margin: 0 0 0.7rem;
      }

      .message-bubble--assistant .markdown-body ul,
      .message-bubble--assistant .markdown-body ol {
        margin: 0.4rem 0 0.7rem 1.3rem;
        padding: 0;
      }

      .message-bubble--assistant .markdown-body li {
        margin-bottom: 0.3rem;
      }

      .message-bubble--assistant .markdown-body pre {
        background: rgba(15, 23, 42, 0.08);
        color: inherit;
        border-radius: 8px;
        padding: 10px 12px;
        overflow: auto;
        margin: 0.5rem 0 0.8rem;
        font-size: 0.95rem;
      }

      .message-bubble--assistant .markdown-body code {
        background: rgba(15, 23, 42, 0.06);
        border-radius: 4px;
        padding: 2px 4px;
        font-size: 0.92rem;
      }

      .message-row--streaming {
        min-height: 85vh;
        align-items: flex-start;
      }
    </style>
    <div class="chat-root">
      <div class="chat-log">
        <div class="chat-log-inner" data-role="log-inner"></div>
      </div>
    </div>
  </body>

</html>
